<div class="min-h-screen flex flex-col bg-[#0C1A35] relative overflow-hidden">

  <!-- Textura diagonal sutil -->
  <div class="absolute inset-0 opacity-[0.035]"
       style="background-image: repeating-linear-gradient(45deg, #fff 0, #fff 1px, transparent 0, transparent 50%); background-size: 20px 20px;"></div>

  <!-- Acento dorado — franja vertical izquierda -->
  <div class="absolute left-0 top-0 bottom-0 w-[2px] bg-gradient-to-b from-transparent via-[#B8872A] to-transparent opacity-70"></div>

  <!-- Círculo decorativo fondo -->
  <div class="absolute -right-32 top-1/4 w-[500px] h-[500px] rounded-full border border-white/[0.04]"></div>
  <div class="absolute -right-16 top-1/3 w-[300px] h-[300px] rounded-full border border-white/[0.03]"></div>

  <!-- Navbar -->
  <nav class="relative z-10 flex items-center justify-between px-8 sm:px-14 py-6 border-b border-white/[0.07]">
    <div class="flex items-center gap-3">
      <img src="assets/logo-capeletti.png" alt="Logo"
           class="h-8 w-8 object-contain"
           onerror="this.style.display='none'"/>
      <div>
        <span class="font-display text-white text-base font-bold">Capeletti</span>
        <span class="text-[#B8872A] text-xs tracking-[0.2em] uppercase font-medium ml-2">Abogados</span>
      </div>
    </div>
    <button (click)="irLogin()"
      class="btn btn-ghost-white text-sm">
      Iniciar sesión
    </button>
  </nav>

  <!-- Hero -->
  <div class="relative z-10 flex-1 flex flex-col items-start justify-center px-8 sm:px-14 lg:px-20 py-20 max-w-5xl mx-auto w-full">

    <!-- Label categoría -->
    <div class="inline-flex items-center gap-2 mb-8">
      <div class="w-1.5 h-1.5 rounded-full bg-[#B8872A]"></div>
      <span class="text-[#B8872A] text-xs font-semibold tracking-[0.2em] uppercase">Sistema de Gestión Interno</span>
    </div>

    <!-- Título editorial -->
    <h1 class="font-display text-white text-5xl sm:text-6xl lg:text-7xl font-bold leading-[1.08] mb-6">
      Especialistas en<br/>
      <span class="text-[#B8872A]">Accidentes</span><br/>
      Laborales
    </h1>

    <!-- Línea divisoria -->
    <div class="w-16 h-px bg-[#B8872A] mb-6"></div>

    <!-- Subtítulo -->
    <p class="text-blue-200/50 text-base sm:text-lg max-w-md mb-12 leading-relaxed">
      Plataforma interna para la gestión de casos, seguimiento de llamadores y administración de expedientes.
    </p>

    <!-- CTA -->
    <button (click)="irLogin()"
      class="btn btn-lg inline-flex items-center gap-3 bg-white text-[#0C1A35] border-white hover:bg-[#F5F3EE] hover:border-[#F5F3EE] font-bold">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l3 3m0 0l-3 3m3-3H3"/>
      </svg>
      Ingresar al sistema
    </button>

    <!-- Stats row -->
    <div class="mt-20 flex items-center gap-8 sm:gap-14 border-t border-white/[0.08] pt-8">
      <div>
        <div class="text-white font-display text-2xl font-bold">⚖</div>
        <div class="text-blue-300/40 text-xs uppercase tracking-wider mt-1">Expedientes</div>
      </div>
      <div class="w-px h-8 bg-white/10"></div>
      <div>
        <div class="text-white font-display text-2xl font-bold">📋</div>
        <div class="text-blue-300/40 text-xs uppercase tracking-wider mt-1">Casos</div>
      </div>
      <div class="w-px h-8 bg-white/10"></div>
      <div>
        <div class="text-white font-display text-2xl font-bold">📱</div>
        <div class="text-blue-300/40 text-xs uppercase tracking-wider mt-1">Llamadores</div>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <div class="relative z-10 px-8 sm:px-14 pb-6 pt-4 border-t border-white/[0.06]">
    <p class="text-blue-300/25 text-xs tracking-wider">
      © {{ year }} Capeletti Abogados · Todos los derechos reservados
    </p>
  </div>

</div>
